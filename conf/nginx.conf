worker_processes  1;

error_log  logs/error.log  info;
pid        logs/nginx.pid;

events {
    worker_connections  4096;
}

rtmp {
    server {
        listen 1935;          # RTMP
        gop_cache  on;   # inherited by app "plain"
        chunk_size  65535;

        application live {
            live             on;
        }
    }
}

http {
    access_log  logs/access.log;

    server {
        listen       8080;

        # WebSocket-FLV 与 HTTP-FLV 共用本端口与同一 location(逐请求升级):
        #   ws 推流: ffmpeg -re -i input.mp4 -c copy -f flv \
        #              -subprotocol post ws://127.0.0.1:8080/live/demo.flv
        #            (FFmpeg 8.0+ 原生 ws 协议;自编译版已内置子协议则无需 -subprotocol)
        #   ws 播放: ffplay ws://127.0.0.1:8080/live/demo.flv
        #   wss:     在 listen 上加 ssl 并换用 wss:// 即可
        location ~ ^/[a-z0-9_]+/.+(\.flv)?$ {
            live_flv  on;
        }

        location = /stat {
            live_stat  on;
        }
    }
}
